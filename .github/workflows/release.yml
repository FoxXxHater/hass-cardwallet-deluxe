name: Release

# Any pushed tag publishes a release. Tags starting with "b" (b1.2.0, beta-3, …)
# are published as pre-releases, everything else as a stable release.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Classify the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nocasematch
          if [[ "$TAG" == b* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Tag '$TAG' starts with b — publishing as a pre-release."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Tag '$TAG' — publishing as a stable release."
          fi

      - name: Compare manifest version with the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # HACS installs what the tag says, but shows what the manifest says.
          # A mismatch is confusing rather than fatal, so this only warns.
          manifest_version="$(
            python3 -c 'import json; print(json.load(open("custom_components/cardwallet/manifest.json"))["version"])'
          )"
          tag_version="${TAG#[bBvV]}"
          if [[ "$manifest_version" != "$tag_version" ]]; then
            echo "::warning::manifest.json is at $manifest_version but the tag is $tag_version"
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          args=(--title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
