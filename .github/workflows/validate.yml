name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run the offline tests
        run: python tests/test_logic.py

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # These checks are about GitHub repository settings, not the code,
          # and only matter for inclusion in the HACS default list:
          # - brands: the icon is not in home-assistant/brands (yet)
          # - issues: issues are disabled on the repository
          # - topics: the repository has no topics
          # - license: the repository has no LICENSE file
          # Drop an entry once it is fixed on GitHub.
          ignore: brands issues topics license
